<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Champions Digital: Ronin Edition</title>
    <style>
        body {
            background-color: rgb(13, 20, 29);
            background-image:
                linear-gradient(rgba(5, 10, 17, 0.3), rgba(5, 10, 17, 0.58)),
                url("/ronin-start-background.webp");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            color: rgb(198, 198, 198);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100svh;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .menu {
            text-align: center;
            padding: 2rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }

        @media (max-aspect-ratio: 3 / 4) {
            body {
                background-position: 68% center;
            }
        }

        .custom-btn {
            width: 130px;
            height: 40px;
            color: #fff;
            padding: 10px 25px;
            font-family: 'Lato', sans-serif;
            font-weight: 500;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
            box-shadow:inset 2px 2px 2px 0px rgba(255,255,255,.5),
            7px 7px 20px 0px rgba(0,0,0,.1),
            4px 4px 5px 0px rgba(0,0,0,.1);
            outline: none;
        }
        /* 3 */
        .btn-3 {
            background: rgb(0, 172, 238);
            background: linear-gradient(0deg, rgba(0, 172, 238, 1) 0%, rgba(2, 126, 251, 1) 100%);
            width: 130px;
            height: 40px;
            line-height: 42px;
            padding: 0;
            border: none;

        }

        .btn-3 span {
            position: relative;
            display: block;
            width: 100%;
            height: 100%;
        }

        .btn-3:before,
        .btn-3:after {
            position: absolute;
            content: "";
            right: 0;
            top: 0;
            background: rgba(2, 126, 251, 1);
            transition: all 0.3s ease;
        }

        .btn-3:before {
            height: 0%;
            width: 2px;
        }

        .btn-3:after {
            width: 0%;
            height: 2px;
        }

        .btn-3:hover {
            background: transparent;
            box-shadow: none;
        }

        .btn-3:hover:before {
            height: 100%;
        }

        .btn-3:hover:after {
            width: 100%;
        }

        .btn-3 span:hover {
            color: rgba(2, 126, 251, 1);
        }

        .btn-3 span:before,
        .btn-3 span:after {
            position: absolute;
            content: "";
            left: 0;
            bottom: 0;
            background: rgba(2, 126, 251, 1);
            transition: all 0.3s ease;
        }

        .btn-3 span:before {
            width: 2px;
            height: 0%;
        }

        .btn-3 span:after {
            width: 0%;
            height: 2px;
        }

        .btn-3 span:hover:before {
            height: 100%;
        }

        .btn-3 span:hover:after {
            width: 100%;
        }

        button:disabled {
            filter: grayscale(1);
            transition: none;
        }
        
        button:disabled span:before,
        button:disabled span:after,
        button:disabled:before,
        button:disabled:after {
            transition: none;
            /* content: unset; */
        }

        #version {
            height: 2rem;
        }

        .wild-mode {
            background: rgb(161, 129, 0);
        }

        .based-on {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: rgb(150, 150, 150);
        }

        .based-on a {
            color: rgb(150, 190, 220);
        }
    </style>
</head>

<body>
    <div class="menu">
        <h1>Marvel Champions Digital</h1>
        <h2>Ronin Edition</h2>
        <div id="version">Version 0.6.0 — “Echo”</div>
        <div style="margin-bottom: 5rem;"></div>
        <script>
            function Open(url) {
                window.location.href = url
            }
        </script>

        <style>
            .main{
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 5px;
            }
        </style>

        <div class="main">
            <button class="custom-btn btn-3" onclick="Open('solo')">
                <span>Quick Game</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('campaign')">
                <span>Campaign</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('replay')">
                <span>Replay</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('deck')">
                <span>Deck Editor</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('cards')">
                <span>View Cards</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('puzzle')">
                <span>Puzzle</span>
            </button>
            <button class="custom-btn btn-3" onclick="Open('credits')">
                <span>Credits</span>
            </button>
        </div>

        <p class="based-on">
            Based on
            <a href="https://irefrixs.itch.io/marvel-lcg" target="_blank" rel="noopener noreferrer">Marvel Champions: Digital Edition</a>
            by Irefrixs
        </p>

        <!-- <hr/>

        <div class="main">
            <button class="custom-btn btn-3 wild-mode" onclick="doReplay('./wild.json')">
                <span>Wild Mode</span>
            </button>
        </div> -->
    </div>

    <script>
        // Function to get a cookie
        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        (async () => {
            // const response_version = await fetch(`get_version?`);
            // version = await response_version.text();
            const version = getCookie('app_version')
            const versionElement = document.querySelector(`#version`);
            if (version) {
                versionElement.title = `Engine build ${version}`;
            }
        })()
    </script>

    <script>
function doReplay(file_name) {
    var ajax = new XMLHttpRequest();
    let cmd = `load_replay?${file_name}`
    ajax.open("GET", cmd, true);
    ajax.onreadystatechange = function () {
        if( this.readyState == 4 ) {
            if( this.status >= 200 && this.status < 300 ) {
                cmd = ".?hot_seat&3d_scene"
                window.open(cmd)
            } else {
                let message = `Could not load replay (${this.status}).`;
                try {
                    message = JSON.parse(this.responseText).error ?? message;
                } catch (_) {
                    // Keep the HTTP fallback for non-JSON server errors.
                }
                alert(message);
            }
        }
    }
    ajax.send();
}
    </script>

</body>

</html>

<script>
class JsonData {
    constructor(version, is_puzzle, time, cover, path, comment, villain, players, seed, checksum, author, step) {
        this.version = version;
        this.is_puzzle = is_puzzle
        this.time = time
        this.cover = cover
        this.path = path
        this.comment = comment
        this.villain = villain
        this.players = players
        this.seed = seed
        this.checksum = checksum
        this.author = author
        this.step = step
    }
}

function get_name(x) {
    return x.split(",")[0]
}

/** @param {string} file_name */
async function create_item(file_name, is_replay) {
    if( is_replay ) {
        rule = "get_replay_json"
    } else {
        rule = "get_puzzle_json"
    }
    const response = await fetch(`${rule}?${file_name}`);
    // Parse the JSON data
    const jsonData = await response.json();

    // Create an instance of JsonData
    // Create an instance of JsonData
    const dataInstance = new JsonData(
        jsonData.version,
        jsonData.is_puzzle,
        jsonData.time,
        jsonData.cover,
        jsonData.path,
        jsonData.comment,
        jsonData.villain,
        jsonData.players,
        jsonData.seed,
        jsonData.checksum,
        jsonData.author,
        jsonData.step,
    );

    let cover = dataInstance.cover
    // if( cover == undefined ) {
    //     cover = "no_image"
    // }

    // Create the main div element
    const replayItemDiv = document.createElement('div');
    replayItemDiv.className = 'replay-item';

    const imagesDiv = document.createElement('div');
    imagesDiv.classList.add('cover-images')

    function create_image(cover) {
        // Create the image div
        const imageDiv = document.createElement('div');
        imageDiv.className = 'image-div';
        imageDiv.setAttribute('data-card-id', cover);

        // Create the image element
        const imgElement = document.createElement('img');
        imgElement.src = cover; // Assuming the image source is the same as cover

        // Append the image to the image div
        imageDiv.appendChild(imgElement);

        return imageDiv
    }

    if( cover ) {
        imagesDiv.appendChild(create_image(cover))
    }
    else {
        for( let player of dataInstance.players ) {
            imagesDiv.appendChild(create_image(get_name(player)))
        }
        imagesDiv.appendChild(create_image(get_name(dataInstance.villain)))
    }




    // Create the button element
    // const buttonElement = document.createElement('button');
    // buttonElement.type = 'submit';
    replayItemDiv.onclick = () => doReplay(file_name, is_replay); // Assuming doReplay is defined elsewhere
    // buttonElement.textContent = 'Replay';

    const commentDiv = document.createElement('div');

    let debug_text = `<span style="color: green" class="tag">Debug</span>`
    let expert_text = `<span style="color: red" class="tag">Expert</span>`
    let no_shuffle_text = `<span style="color: green" class="tag">No Shuffle</span>`
    let checksum_text = `<span style="color: deepskyblue" class="tag">Official</span>`
    commentDiv.innerHTML = `${file_name}<br/>
    <span class='comment'>${dataInstance.comment}</span><br/>
    `

    if( dataInstance.step == 0 && dataInstance.author && !dataInstance.checksum) {
        commentDiv.innerHTML += `
        Author: ${dataInstance.author}<br/><br/>
        `
    } else {
        commentDiv.innerHTML += `
        ${dataInstance.step > 0 ? "Step: " + dataInstance.step : ""}<br/><br/>
        `
    }

    commentDiv.innerHTML += `
    ${file_name.includes('debug') ? debug_text : ""} ${file_name.includes('expert') ? expert_text : ""} ${dataInstance.seed == 0 ? no_shuffle_text : ""} ${dataInstance.checksum && !is_replay ? checksum_text : ""}
    `

    // Append the image div and button to the main div
    replayItemDiv.appendChild(imagesDiv);
    replayItemDiv.appendChild(commentDiv);

    if( is_replay ) {
        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'replay-actions';

        const playButton = document.createElement('button');
        playButton.textContent = 'Play';
        playButton.onclick = (event) => {
            event.stopPropagation();
            doReplay(file_name, true);
        };

        const downloadButton = document.createElement('button');
        downloadButton.textContent = 'Download';
        downloadButton.onclick = (event) => {
            event.stopPropagation();
            window.location.href = `download_replay?file=${encodeURIComponent(file_name)}`;
        };

        actionsDiv.appendChild(playButton);
        actionsDiv.appendChild(downloadButton);
        replayItemDiv.appendChild(actionsDiv);
    }

    return replayItemDiv;
}
</script>


<script>
async function get_data(is_replay) {
    let list_files = ""
    if( is_replay ) {
        list_files = "list_replay_files"
        parent = document.querySelector("#replay-items")
    } else {
        if( document.location.pathname == '/puzzle_test' ) {
            list_files = "list_puzzle_test_files"
            document.getElementById('main-puzzle').style.display = 'none'
        } else {
            list_files = "list_puzzle_files"
        }
        parent = document.querySelector("#puzzle-items")
    }
    parent.style.display = "flex"
    const response = await fetch(`${list_files}?`);
    if (!response.ok) {
        throw new Error('Network response was not ok: ' + response.statusText);
    }
    const data = await response.json();
    for( let file_name of data ) {
        if( true || !file_name.includes('-debug') ) {
            const div = await create_item(file_name, is_replay)
            parent.appendChild(div)
        }
    }
}
let is_puzzle_page = (document.location.pathname == '/puzzle' || document.location.pathname == '/puzzle_test');
if( is_puzzle_page ) {
    document.title = "Puzzle"
} else {
    document.title = "Replay"
}

(async () => {
    if( is_puzzle_page ) {
        await get_data(false)
    } else {
        await get_data(true)
    }
})()

async function doReplay(file_name, is_replay) {
    const gameWindow = window.open('', '_blank');
    let cmd = ""
    if( is_puzzle_page ) {
        cmd = `load_puzzle?${file_name}`
    } else {
        cmd = `load_replay?${file_name}`
    }

    const response = await fetch(cmd);
    if( !response.ok ) {
        gameWindow?.close();
        let error = `Could not load replay (${response.status}).`;
        try {
            const data = await response.json();
            if( data.error ) {
                error = data.error;
            }
        } catch (_) {
            // Keep the HTTP fallback for non-JSON server errors.
        }
        alert(error);
        return;
    }

    cmd = ".?hot_seat&3d_scene"
    if( is_replay ) {
        cmd = `${cmd}&replay`
    }
    if( gameWindow ) {
        gameWindow.location.href = cmd;
    } else {
        window.location.href = cmd;
    }
}
</script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?ronin=1">
    <link rel="stylesheet" href="/public/css/solo.css">
</head>
<body>
    <main class="solo-setup">
        <header class="page-header">
            <div>
                <h1>Campaign</h1>
                <p>Start a campaign or continue the one saved in this browser.</p>
            </div>
            <a class="back-link" href="/main">← Main menu</a>
        </header>

        <nav class="mode-nav" aria-label="Game mode">
            <a class="mode-link" href="/solo">Quick Game</a>
            <a class="mode-link active" href="/campaign" aria-current="page">Campaign</a>
        </nav>

        <section id="saved-campaign-section" class="selection-section saved-campaign" hidden aria-labelledby="saved-campaign-heading">
            <div class="section-heading">
                <div>
                    <span class="step-number">↻</span>
                    <h2 id="saved-campaign-heading">Saved Campaign</h2>
                </div>
                <span id="saved-campaign-status" class="campaign-status"></span>
            </div>
            <div class="saved-campaign-content">
                <div>
                    <strong id="saved-campaign-name"></strong>
                    <p id="saved-campaign-summary" class="load-status"></p>
                </div>
                <button id="resume-campaign-button" class="secondary-button" type="button">Continue Campaign</button>
            </div>
        </section>

        <section class="selection-section" aria-labelledby="campaign-heading">
            <div class="section-heading">
                <div>
                    <span class="step-number">1</span>
                    <h2 id="campaign-heading">Campaign</h2>
                </div>
                <span id="campaign-selection" class="current-selection">Not selected</span>
            </div>
            <p id="campaign-status" class="load-status">Loading campaigns…</p>
            <div id="campaign-list" class="choice-grid campaign-grid" aria-live="polite"></div>
        </section>

        <section id="scenario-section" class="selection-section" aria-labelledby="scenario-heading" hidden>
            <div class="section-heading">
                <div>
                    <span class="step-number">2</span>
                    <h2 id="scenario-heading">Current Scenario</h2>
                </div>
                <span id="scenario-progress" class="current-selection"></span>
            </div>
            <div id="scenario-preview" class="scenario-preview"></div>
        </section>

        <section class="selection-section" aria-labelledby="hero-heading">
            <div class="section-heading">
                <div>
                    <span class="step-number">3</span>
                    <h2 id="hero-heading">Starter Deck</h2>
                </div>
                <span id="hero-selection" class="current-selection">Not selected</span>
            </div>
            <p id="hero-status" class="load-status">Loading decks…</p>
            <div id="hero-list" class="choice-grid" aria-live="polite"></div>
        </section>

        <footer class="play-panel">
            <p id="error-message" class="error-message" role="alert"></p>
            <button id="play-button" class="play-button" type="button" disabled>Play</button>
            <a class="advanced-link" href="/scene">Advanced Setup</a>
        </footer>
    </main>

    <script type="module" src="/public/js/campaign.js?ronin-session=1"></script>
</body>
</html>

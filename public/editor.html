    <script>
        document.getElementById('client').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the default form submission

            const formData = new FormData(this);

            // Convert FormData to URL-encoded string
            const formParams = new URLSearchParams();
            formData.forEach((value, key) => {
                formParams.append(key, value);
            });

            fetch('/process', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formParams.toString()
            })
            .then(response => response.text())
            .then(data => {
                console.log(data); // Log the response data to the console
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
    </script>

<script>
    var response
    var j

    function LoadJson() {
        var ajax = new XMLHttpRequest();
        ajax.open("GET", `https://marvelcdb.com/api/public/card/${card_id.value}.json`, true);
        document.querySelector(`#name`).value = ''
        document.querySelector(`#text`).value = ''
        ajax.onreadystatechange = function () {
            if( this.readyState == 4 ) {

                document.querySelectorAll('input').forEach(e => {
                    if( e.value != "Load Image" && e.value != "Load Json" && e.id != "card_id" && e.type != 'checkbox') {
                        e.value = ""
                    }
                })
                document.querySelectorAll('select').forEach(e => {
                    e.value = ""
                })

                response = this.response
                console.log(response)

                j = JSON.parse(response)
                j['type_name'] = j['type_name'].replace(/ /, "")
                let map = {
                    "name": "name",
                    "subtitle": "subname",
                    "pack": "pack_code",
                    "type": "type_name",
                    "class": "faction_name",
                    "traits": "traits",
                    "cost": "cost",
                    "health": "health",
                    "thwart": "thwart",
                    "attack": "attack",
                    "scheme": "scheme",
                    "defend": "defense",
                    "recover": "recover",
                    "boost": "boost",
                    "acceleration": "scheme_acceleration",
                    "hazard": "scheme_hazard",
                    "starting_threat": "base_threat",
                    "target_threat": "threat",
                    "escalation_threat": "escalation_threat",
                    "hand_size": "hand_size",
                    "crisis": "scheme_crisis",
                    "text": "text",
                    "set_name": "card_set_name",
                    "stage": "stage",
                }

                for( key in map ) {
                    e = document.querySelector(`#${key}`)
                    if( j[map[key]] != undefined ) {
                        if( key == 'type' && j[map[key]] == 'Alter-Ego' ) {
                            j[map[key]] = 'AlterEgo'
                        }
                        if( key == 'type' && j[map[key]] == 'PlayerSide Scheme' ) {
                            j[map[key]] = 'PlayerSideScheme'
                        }
                        if( key == 'type' && j[map[key]].startsWith("Evidence") ) {
                            j[map[key]] = 'Evidence'
                        }
                        e.value = j[map[key]]
                    }
                }

                if( j['cost_per_hero'] ) {
                    e = document.querySelector(`#cost`)
                    if( e.value ) {
                        e.value += "*"
                    }
                }

                if( !j['escalation_threat_fixed'] ) {
                    e = document.querySelector(`#escalation_threat`)
                    if( e.value ) {
                        e.value += "*"
                    }
                }
                if( !j['threat_fixed'] ) {
                    e = document.querySelector(`#target_threat`)
                    if( e.value ) {
                        e.value += "*"
                    }
                }
                if( !j['base_threat_fixed'] ) {
                    e = document.querySelector(`#starting_threat`)
                    if( e.value ) {
                        e.value += "*"
                    }
                }

                e = document.querySelector(`#traits`)
                e.value = e.value.toUpperCase()

                e = document.querySelector(`#unique`)
                if( j['is_unique'] ) {
                    e.value = "1"
                } else {
                    e.value = "0"
                }

                if( j['health_per_hero'] ) {
                    e = document.querySelector(`#health`)
                    e.value += "*"
                }

                if( j['thwart_cost'] ) {
                    e = document.querySelector(`#thwart`)
                    e.value += "*".repeat(j['thwart_cost'])
                }
                if( j['attack_cost'] ) {
                    e = document.querySelector(`#attack`)
                    e.value += "*".repeat(j['attack_cost'])
                }
                let total = 0
                for( let x of ['resource_physical', 'resource_energy', 'resource_wild', 'resource_mental'] ) {
                    if( j[x] != undefined ) {
                        total += j[x]
                    }
                }
                if( total > 0 ) {
                    e = document.querySelector(`#resource`)
                    e.value += "R".repeat(j['resource_physical'])
                    e.value += "G".repeat(j['resource_wild'])
                    e.value += "Y".repeat(j['resource_energy'])
                    e.value += "B".repeat(j['resource_mental'])
                }
                ShowDiv(document.querySelector('#type'))
            }
        }
        ajax.send();
    }

    function ShowImg() {
        card_id = document.getElementById("card_id")
        if( card_id.value in window.cardStatistics.const_card_dict ) {
            alert("Existed")
        }

        card_image = document.getElementById("card_image")
        card_image.src = card_id.value

        card_image_rotate = document.getElementById("card_image_rotate")
        card_image_rotate.src = card_id.value
    }

    function ShowDiv(element) {
        // let names = ["ally","alter_ego","attachment","environment","event","hero","main_scheme","minion","obligation","player_side_scheme","resource","side_scheme","support","treachery","upgrade","villain"]
        name = element.value
        els = Array.from(document.getElementsByTagName('img'))
        els.push(...Array.from(document.getElementsByTagName('label')))
        els.forEach(function (e) {
            if (e.classList == '' || e.classList.contains(name)) {
                e.classList.remove('hide')
                x = e.querySelectorAll('input,select')
                if (x.length > 0) {
                    if( x[0].classList.contains('required') ) {
                        x[0].required = true
                    }
                }
            } else {
                e.classList.add('hide')
                x = e.querySelectorAll('input,select')
                if (x.length > 0 && x.type != 'checkbox') {
                    x[0].value = ""
                    x[0].required = false
                }
            }
        });
    }
</script>

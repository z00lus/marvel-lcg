<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle Editor</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?ronin=1">
    <link rel="stylesheet" href="/public/css/font-awesome.css">
    <style>
        body {
            font-family: monospace;
            background-color: rgb(43, 43, 43);
            color: rgb(198, 198, 198);
            margin: 10px;
        }

        #contextMenu {
            display: none;
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            color: #000;
            z-index: 1000;
        }
        #contextMenu div {
            padding: 8px;
            cursor: pointer;
        }
        #contextMenu div:hover {
            background: #f0f0f0;
        }
        .card_id {
            width: 8rem;
        }
        .puzzle-function {
            border: 1px solid black;
            padding: 5px;
        }
        .puzzle-function:hover {
            border: 1px solid white;
        }
        .puzzle-function .handle,
        .puzzle-function button {
            margin-right: 5px;
        }
        .puzzle-function button:hover {
            background-color: red;
        }

        .hide {
            display: none;
        }
    </style>
</head>
<body>

<fieldset>
    <legend>Puzzle Editor <i class="fa fa-flask" aria-hidden="true"></i></legend>

    <label class="hide" for="version">Version:</label>
    <input class="hide" type="text" id="version" required value="0.6.0.0">
    <label class="hide" for="cover">Cover:</label>
    <input class="hide" type="text" id="cover">
    <label class="hide" for="comment">Comment:</label>
    <input class="hide" type="text" id="comment">
    <label class="hide" for="seed">Seed:</label>
    <input class="hide" type="number" id="seed" required value="10010001">

    <pre style="display: none;">
Rule:
Use "," for double face card
Use ";" for multiple card
    </pre>

    <style>
        .card_id {
            background-color: green;
        }
        .cards_id {
            background-color: rgb(199, 199, 199);
            width: 100%;
        }
    </style>

    <label for="villain">Villain:</label>
    <input class="card_id" type="text" id="villain" required value="01094"><br>

    <label for="schemes">Schemes:</label>
    <input class="card_id" type="text" id="schemes" required value="01097a,01097b"><br>

    <label for="encounter_deck">Encounter Deck:</label>
    <input class="cards_id" type="text" id="encounter_deck" required><br>

    <label for="encounter_discard_pile">Encounter Discard Pile:</label>
    <input class="cards_id" type="text" id="encounter_discard_pile" required><br>

    <label for="set_aside">Set Aside:</label>
    <input class="cards_id" type="text" id="set_aside"><br>

    <label for="expert">Expert:</label>
    <input type="checkbox" id="expert"><br>

    <!-- <h3>Player Data</h3> -->
    <label for="identities">Identity:</label>
    <input class="card_id" type="text" id="identities" required value="01001b"><br>

    <label for="hand_cards">Hand Cards:</label>
    <input class="cards_id" type="text" id="hand_cards" required value="01088; 01089; 01090; "><br>

    <label for="player_deck">Player Deck:</label>
    <input class="cards_id" type="text" id="player_deck" required><br>

    <label for="player_discard_pile">Player Discard Pile:</label>
    <input class="cards_id" type="text" id="player_discard_pile" required><br>

    <div id="editor" style="height: 300px; width: 100%;">
        <p style="color: gray;">Right-click here to add functions</p>
    </div>

</fieldset>

<div id="contextMenu">
    <!-- <div onclick="addFunction('Gain')">Gain</div> -->
    <!-- <div onclick="addFunction('Discard')">Discard</div> -->
    <!-- <div onclick="addFunction('Counter')">Counter</div> -->
    <!-- <div onclick="addFunction('Token')">Token</div> -->
    <div onclick="addFunction('')">Custom Script</div>
    <div onclick="addFunction('Reveal')">Reveal</div>
    <div onclick="addFunction('Boost')">Boost</div>
    <div onclick="addFunction('PutIntoPlay')">PutIntoPlay</div>
    <div onclick="addFunction('End')">Prompt</div>
    <!-- <div onclick="addFunction('PutIntoDeck')">PutIntoDeck</div> -->
    <!-- <div onclick="addFunction('End')">End</div> -->
</div>

<fieldset>
    <legend>Play</legend>
    <button onclick="playPuzzleData(false)">Play</button>
    <button onclick="playPuzzleData(true)">Play (Debug)</button>
    <button onclick="savePuzzleData()">Save</button> Put the saved files into ./puzzle/ to play
</fieldset>

<pre id="output" style="display: none;"></pre>

<script src="/public/js/lib/sortable.js"></script>
<script>
    let el = document.getElementById('editor');
    Sortable.create(el, {
        multiDrag: true, // Enable multi-drag
        selectedClass: 'selected', // The class applied to the selected items
        fallbackTolerance: 3, // So that we can select items on mobile
        animation: 150,
        handle: '.handle', // handle's class
        ghostClass: 'blue-background-class'
    });
</script>

<script>
    const editor = document.getElementById('editor');
    const contextMenu = document.getElementById('contextMenu');

    editor.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        contextMenu.style.display = 'block';
        contextMenu.style.left = e.pageX + 'px';
        contextMenu.style.top = e.pageY + 'px';
    });

    document.addEventListener('click', function() {
        contextMenu.style.display = 'none';
    });

    function addFunction(funcName) {
        // Create a new div for the function
        const functionDiv = document.createElement('div');
        functionDiv.classList.add('puzzle-function'); // Add a special class
        functionDiv.dataset.funcName = funcName; // Store the function name in a data attribute

        const handle = document.createElement('i');
        handle.classList.add("handle", "fa", "fa-arrows");
        functionDiv.appendChild(handle);

        // Create the remove button
        const close = document.createElement('button');
        close.classList.add("fa", "fa-times");
        close.onclick = function() {
            editor.removeChild(functionDiv);
        };
        functionDiv.appendChild(close);

        // Create the function name text node
        const funcText = document.createTextNode(` ${funcName} `);
        functionDiv.appendChild(funcText);

        // Create input fields based on function name (you can customize this)
        if (funcName === '') {
            const cardInput = document.createElement('input');
            cardInput.type = 'text';
            functionDiv.appendChild(cardInput);
        }
        else if (funcName === 'End') {
            const cardInput = document.createElement('input');
            cardInput.type = 'text';
            functionDiv.appendChild(cardInput);
        }
        else if (funcName === 'Gain') {
            const cardInput = document.createElement('input');
            cardInput.type = 'text';
            cardInput.classList = 'card_id'
            functionDiv.appendChild(cardInput);
        } else if (funcName === 'Token') {
            const cardInput = document.createElement('input');
            cardInput.type = 'text';
            functionDiv.appendChild(cardInput);

            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            functionDiv.appendChild(nameInput);

            const sizeInput = document.createElement('input');
            sizeInput.type = 'number';
            functionDiv.appendChild(sizeInput);
        } else {
            const cardInput = document.createElement('input');
            cardInput.type = 'text';
            cardInput.classList = 'card_id'
            functionDiv.appendChild(cardInput);
        }

        // Append the function div to the editor
        editor.appendChild(functionDiv);
    }

    // function generateCode() {
    //     const ajax = new XMLHttpRequest();
    //     ajax.open("GET", `new_puzzle?${output.innerHTML}`, true);
    //     ajax.onreadystatechange = function () {
    //         if( this.readyState == 4 ) {
    //             console.log('ok')
    //             cmd = "/table?hot_seat"
    //             window.open(cmd)
    //         }
    //     }
    //     ajax.send();
    // }

    function submitPuzzleData() {
        let puzzle_text = []
        const functions = editor.querySelectorAll('.puzzle-function');

        function parseInput(input) {
            return input
                ? input.split(";")
                    .map(item => item.trim())
                    .filter(item => item !== "") // Filter out empty strings
                : [];
        }

        // for( let card of parseInput(document.querySelector("#hand_cards").value) ) {
        //     puzzle_text.push(`Puzzle.Gain('${card}')`)
        // }
        // for( let card of parseInput(document.querySelector("#player_discard_pile").value) ) {
        //     puzzle_text.push(`Puzzle.Discard('${card}')`)
        // }
        // for( let card of parseInput(document.querySelector("#encounter_discard_pile").value) ) {
        //     puzzle_text.push(`Puzzle.Discard('${card}')`)
        // }

        for (let func of functions) {
            const funcName = func.dataset.funcName;
            const params = func.getElementsByTagName('input');
            if( funcName ) {
                if( params[0].value == '' ) {
                    continue
                }
                const paramValues = Array.from(params).map(input => input.value ? `'${input.value}'` : '').join(', ');
                puzzle_text.push(`Puzzle.${funcName}(${paramValues});`);
            } else {
                puzzle_text.push(`Puzzle.${params[0].value};`);
            }
        }
        puzzle_text.push(`Puzzle.End()`)

        const puzzleData = {
            version: document.querySelector("#version").value,
            author: '',
            cover: document.querySelector("#cover").value,
            comment: document.querySelector("#comment").value,
            seed: parseInt(document.querySelector("#seed").value),
            villain: parseInput(document.querySelector("#villain").value),
            schemes: parseInput(document.querySelector("#schemes").value),
            encounter_deck: parseInput(document.querySelector("#encounter_deck").value),
            encounter_discard_pile: parseInput(document.querySelector("#encounter_discard_pile").value),
            set_aside: parseInput(document.querySelector("#set_aside").value),
            expert: document.querySelector("#expert").checked,
            players: [{
                identities: parseInput(document.querySelector("#identities").value),
                hand_cards: parseInput(document.querySelector("#hand_cards").value),
                player_deck: parseInput(document.querySelector("#player_deck").value),
                player_discard_pile: parseInput(document.querySelector("#player_discard_pile").value),
                set_aside: []
            }],
            puzzle_command: puzzle_text
        };

        const output = document.getElementById('output');
        output.innerText = JSON.stringify(puzzleData, null, 4)

        return puzzleData
    }

    async function playPuzzleData(show_id) {
        const puzzleData = submitPuzzleData()

        try {
            // Convert the puzzleData object to a query string
            const queryString = JSON.stringify(puzzleData);

            const response = await fetch(`new_puzzle?${queryString}`, {
                method: 'GET', // Use GET method
                headers: {
                    'Accept': 'application/json' // Specify that we expect JSON response
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const responseData = await response.json(); // Parse the JSON response
            // cmd = "/table?hot_seat&show_all_cards"
            cmd = "/table?hot_seat"
            if( show_id ) {
                cmd += '&show_card_id&show_all_cards'
            }
            window.open(cmd)

            console.log('Response from server:', responseData);
        } catch (error) {
            console.error('Error sending puzzle data:', error);
        }
    }
</script>

<script type="module">
    import { saveAsFile } from '../lib/save_file.js'
    function savePuzzleData() {
        const puzzleData = submitPuzzleData()
        saveAsFile(JSON.stringify(puzzleData, null, 4), "puzzle.json")
    }
    window.savePuzzleData = savePuzzleData;
</script>

</body>
</html>

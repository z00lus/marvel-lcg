<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?ronin=1">
<style>
    .report-bug-window {
        font-family: monospace;
        background-color: #2b2b2b;
        color: white;
    }
</style>

<title>Bug Report</title>
</head>

<body class="report-bug-window">

<p id="thankYou"></p>

<!-- <p>You can add any comments and press `Upload` to continue the upload.</p> -->

<textarea type="text" style="width: 100%;" rows="4" id="userInput"></textarea>

    <hr>

    <script>
        let receivedData = undefined
        async function do_upload(e) {
            alert("Upload is disable in Open Source version")
            return
        }
        function do_cancel(e) {
            window.close()
        }
    </script>

    <div style="color: gray">
    <p>Notice: We will <B>automatically</B> collect some additional information when you upload your save file:</p>
    <ol>
        <li>Operating system details</li>
        <li>Browser information</li>
        <li>Gaming session duration</li>
    </ol>
    </div>

    <button onclick="do_upload(this)">Upload</button>
    <!-- <button onclick="do_cancel(this)">Cancel</button> -->

    <style>
        #status-p {
            position: absolute;
            bottom: 0;
            color: gray;
        }
    </style>
    <p id="status-p">status | <span id="status">Waiting for upload</span></p>

    <script>
        const userInputDiv = document.querySelector('#userInput')
        const thankYouDiv = document.querySelector('#thankYou')
        // Listen for messages from the main window
        window.addEventListener('message', (event) => {
            // You can check event.origin to ensure the message is from a trusted source
            switch( event.data.type ) {
                case 'uploadSave':
                    receivedData = event.data;
                    console.log(receivedData); // { key1: "value1", key2: "value2" }
                    userInputDiv.value = receivedData['comment']
                    switch( receivedData['save_type'] ) {
                        case 'Bug':
                            thankYouDiv.innerHTML = "Thank you for reporting the bug in this game. Please provide details about the bug following these instructions:"
                            userInputDiv.placeholder = "1. Which card?\n2. What issue did you encounter?\n3. (Optional) What did you expect?\nTip: Click a card to insert its details.";
                            break
                        case 'Share':
                            thankYouDiv.innerHTML = "Thank you for sharing your save file. We will archive it and add it to our unit test list to ensure that our new version update does not break your operations with this save file."
                            userInputDiv.placeholder = "(Optional) You can type any comments here if you wish."
                            break
                        case 'Crash':
                            thankYouDiv.innerHTML = "Please click 'Upload' to sharing your save file to help us improve the game!"
                            break
                    }

                    break;
                case 'setLastClickCard':
                    text = `[${event.data['card_name']}](${event.data['card_id']},c${event.data['card_object_id']})`
                    userInputDiv.value += text
                    break;
            }
        });
    </script>
</body>
</html>
